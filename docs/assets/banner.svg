<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1530"/><stop offset="1" stop-color="#1B2A6B"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EE7DF"/><stop offset="1" stop-color="#4A6CF7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5EE7DF" stop-opacity="0.35"/><stop offset="1" stop-color="#5EE7DF" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="480" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="90" cy="70" r="1.6" opacity=".7"/><circle cx="220" cy="140" r="1.1" opacity=".5"/><circle cx="560" cy="60" r="1.4" opacity=".6"/>
    <circle cx="700" cy="410" r="1.2" opacity=".5"/><circle cx="1180" cy="90" r="1.8" opacity=".7"/><circle cx="1220" cy="380" r="1.2" opacity=".5"/>
    <circle cx="980" cy="40" r="1.1" opacity=".5"/><circle cx="140" cy="420" r="1.4" opacity=".6"/><circle cx="1050" cy="440" r="1" opacity=".5"/>
  </g>
  <!-- moon -->
  <g transform="translate(1110 120)">
    <circle r="42" fill="#FDF3EA" opacity=".95"/><circle cx="18" cy="-12" r="38" fill="#152052"/>
    <text x="34" y="-26" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FDF3EA" opacity=".8">z</text>
    <text x="50" y="-46" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#FDF3EA" opacity=".6">z</text>
  </g>
  <!-- icon -->
  <circle cx="300" cy="240" r="230" fill="url(#glow)"/>
  <g transform="translate(150 90)" filter="url(#sh)">
    <rect width="300" height="300" rx="68" fill="url(#tile)"/>
    <circle cx="150" cy="150" r="115" fill="#1C1C22"/>
    <g fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="1.5">
      <circle cx="150" cy="150" r="106"/><circle cx="150" cy="150" r="98"/><circle cx="150" cy="150" r="90"/>
      <circle cx="150" cy="150" r="82"/><circle cx="150" cy="150" r="74"/><circle cx="150" cy="150" r="66"/><circle cx="150" cy="150" r="58"/>
    </g>
    <path d="M150 150 L195 44 A115 115 0 0 1 238 77 Z" fill="#fff" opacity=".1"/>
    <circle cx="150" cy="150" r="47" fill="#FDF3EA"/>
    <rect x="126" y="128" width="14" height="44" rx="4" fill="#4A6CF7"/><rect x="160" y="128" width="14" height="44" rx="4" fill="#4A6CF7"/>
  </g>
  <!-- text -->
  <text x="540" y="210" font-family="-apple-system,'SF Pro Display',Helvetica,Arial,sans-serif" font-size="96" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Mustop</text>
  <text x="544" y="262" font-family="-apple-system,'SF Pro Text',Helvetica,Arial,sans-serif" font-size="28" font-weight="500" fill="#A9C3FF">Music + Stop · a sleep timer for NetEase Cloud Music</text>
  <text x="544" y="304" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="26" font-weight="500" fill="#7FE3DA">给 Mac 版网易云音乐补上「定时关闭」</text>
  <!-- menu bar pill -->
  <g transform="translate(544 342)">
    <rect width="222" height="44" rx="12" fill="#FFFFFF" fill-opacity=".1" stroke="#fff" stroke-opacity=".18"/>
    <text x="20" y="30" font-family="-apple-system,'SF Pro Text',Helvetica,Arial,sans-serif" font-size="22" fill="#fff">☾ᶻ</text>
    <text x="58" y="30" font-family="'SF Mono',Menlo,monospace" font-size="22" font-weight="600" fill="#fff">29:58</text>
    <text x="140" y="30" font-family="-apple-system,'SF Pro Text',Helvetica,Arial,sans-serif" font-size="18" fill="#fff" opacity=".55">→ ❚❚</text>
  </g>
</svg>
