<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5EE7DF"/><stop offset="1" stop-color="#4A6CF7"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A6CF7"/></marker>
  </defs>
  <rect width="1200" height="300" rx="20" fill="#F4F7FF"/>
  <g font-family="-apple-system,'SF Pro Text','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,sans-serif" text-anchor="middle">
    <g transform="translate(150 120)">
      <circle r="52" fill="#fff" stroke="url(#g)" stroke-width="4"/>
      <g stroke="#4A6CF7" stroke-width="5" stroke-linecap="round" fill="none"><circle r="26"/><path d="M0 -14 V0 L10 8"/></g>
      <text y="90" font-size="22" font-weight="700" fill="#1B2A6B">Pick a time</text>
      <text y="118" font-size="15" fill="#5A6785">15 min … 1.5 h, or custom</text>
    </g>
    <g transform="translate(450 120)">
      <circle r="52" fill="#fff" stroke="url(#g)" stroke-width="4"/>
      <text y="9" font-family="'SF Mono',Menlo,monospace" font-size="24" font-weight="700" fill="#4A6CF7">29:58</text>
      <text y="90" font-size="22" font-weight="700" fill="#1B2A6B">Countdown</text>
      <text y="118" font-size="15" fill="#5A6785">shown next to ☾ᶻ in the menu bar</text>
    </g>
    <g transform="translate(750 120)">
      <circle r="52" fill="#fff" stroke="url(#g)" stroke-width="4"/>
      <g fill="#4A6CF7"><rect x="-26" y="-20" width="52" height="8" rx="3"/><rect x="-26" y="-4" width="52" height="8" rx="3" opacity=".35"/><rect x="-26" y="12" width="52" height="8" rx="3" opacity=".35"/></g>
      <path d="M14 -10 l18 22 -9 -1 5 11 -5 2 -5 -11 -6 6 z" fill="#1B2A6B"/>
      <text y="90" font-size="22" font-weight="700" fill="#1B2A6B">Time's up</text>
      <text y="118" font-size="15" fill="#5A6785">press Controls → Pause</text>
    </g>
    <g transform="translate(1050 120)">
      <circle r="52" fill="url(#g)"/>
      <rect x="-16" y="-20" width="11" height="40" rx="3" fill="#fff"/><rect x="5" y="-20" width="11" height="40" rx="3" fill="#fff"/>
      <text y="90" font-size="22" font-weight="700" fill="#1B2A6B">Music stops</text>
      <text y="118" font-size="15" fill="#5A6785">already paused? do nothing</text>
    </g>
    <g stroke="#4A6CF7" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#a)">
      <line x1="218" y1="120" x2="382" y2="120"/><line x1="518" y1="120" x2="682" y2="120"/><line x1="818" y1="120" x2="982" y2="120"/>
    </g>
    <text x="600" y="280" font-size="14" fill="#8A94B0">via the Accessibility API — NetEase Cloud Music for Mac has no AppleScript, and MediaRemote doesn't work on macOS 27</text>
  </g>
</svg>
